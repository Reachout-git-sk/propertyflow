version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: propertyflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: propertyflow
    ports:
      # Only this computer can reach the database (not other devices on the Wi-Fi)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - propertyflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propertyflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Owner connection: only for `prisma migrate deploy` and `npm run db:app-role` at startup
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/propertyflow?schema=public
      # The app's own connection as the restricted role, so row-level security applies
      APP_DATABASE_URL: postgresql://propertyflow_app:local-dev-only-password@postgres:5432/propertyflow?schema=public
      # Never write the secret here (this file is public). Put JWT_SECRET in a .env file next
      # to this file (it is git-ignored, see .env.example). If it is missing, the backend
      # refuses to start and says how to generate one.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: 1h
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - propertyflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: propertyflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - propertyflow-network

volumes:
  postgres_data:

networks:
  propertyflow-network:
    driver: bridge