version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: propertyflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: propertyflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - propertyflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propertyflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/propertyflow?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-this
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - propertyflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: propertyflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - propertyflow-network

volumes:
  postgres_data:

networks:
  propertyflow-network:
    driver: bridge