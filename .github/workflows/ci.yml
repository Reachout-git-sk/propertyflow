# Continuous integration (added October 2026).
# On every push to main and every pull request, GitHub starts a fresh Linux machine,
# installs the backend, builds it, and runs all tests against a real PostgreSQL.
# If any step fails, the run turns red and the commit or pull request shows a ❌.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only needs to read the code. Giving it nothing more is safer.
permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # A throwaway PostgreSQL that lives only for this run (same version as docker-compose.yml)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propertyflow_test
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Read by tests/env.ts. These passwords only exist inside this temporary CI database.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propertyflow_test?schema=public
      TEST_APP_DATABASE_URL: postgresql://propertyflow_app:ci-only-password@localhost:5432/propertyflow_test?schema=public&connection_limit=1

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # Reuse downloaded packages between runs (keyed on the lockfile)
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` installs exactly what package-lock.json says, and fails if the
      # lockfile and package.json disagree
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # `tsc` type-checks every file; a type error fails the build
      - name: Type-check and build
        run: npm run build

      # Fails if someone changed schema.prisma but forgot to create a migration
      - name: Check migrations match schema.prisma
        run: |
          echo "CREATE DATABASE propertyflow_shadow;" | npx prisma db execute --stdin --url "$TEST_DATABASE_URL"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/propertyflow_shadow" \
            --exit-code

      # Rebuilds the test database from the migrations (including row-level security),
      # then runs every test file
      - name: Run tests
        run: npm test
