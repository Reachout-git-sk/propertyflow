# nginx config for the frontend container (docker-compose.yml).
# Serves the built React app and forwards /api calls to the backend container, so the
# browser talks to ONE address (http://localhost) and needs no CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls (including file downloads, which need a login) go to the backend.
    # "backend" is the service name in docker-compose.yml; Docker's network turns it into
    # the container's address.
    location /api/ {
        proxy_pass http://backend:5000;

        # Tell the backend who the real visitor is. The backend trusts exactly one proxy
        # (TRUST_PROXY=1), so its rate limits count each visitor, not nginx as one user.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx refuses bodies over 1 MB by default. Uploads may be up to 10 MB
        # (MAX_FILE_SIZE in the backend), plus a little room for the other form fields.
        client_max_body_size 11m;
    }

    # React Router handles pages like /login in the browser. A refresh on such a page asks
    # nginx for a file that does not exist, so answer with index.html and let React decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
